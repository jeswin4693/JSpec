name: CI

# Solo repo: run on pushes to main and on any PR you open against it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push cancels an in-flight run for the same ref - no queue pile-up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is excluded deliberately - see DECISIONS.md D-013.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # `graph` is not optional in CI: C-06's tests parse real source, and
          # without the grammars they would skip rather than fail, which is the
          # quietest way for an extractor to stop working.
          python -m pip install ./core[dev,graph]

      - name: Lint
        run: ruff check core tests

      - name: Format check
        run: ruff format --check core tests

      - name: Test
        run: pytest

      - name: The extractor reads this repository (C-06)
        # An extractor that silently returns nothing passes every unit test that
        # only checks shapes. This asserts it found real symbols in a real tree,
        # read every file it claimed to, and separated the sub-folders (D-032).
        run: |
          python core/scripts/jspec.py extract --profile jspec-self > extract.json
          python -c "
          import json, sys
          r = json.load(open('extract.json'))
          problems = []
          if r['symbols'] < 100:
              problems.append(f\"only {r['symbols']} symbols found\")
          if r['files_unreadable']:
              problems.append(f\"unreadable: {r['unreadable']}\")
          if r['files_with_syntax_errors']:
              problems.append(f\"syntax errors: {r['syntax_errors']}\")
          if r['modules'] != ['core', 'tests']:
              problems.append(f\"modules {r['modules']}, expected ['core', 'tests']\")
          sys.exit('; '.join(problems)) if problems else print('ok', r['symbols'], 'symbols')
          "

      - name: The store indexes this repository, then re-reads nothing (C-07)
        # The one claim unit tests cannot make about a cache: that the SECOND run
        # is cheap on a real tree. A store that quietly re-parses everything passes
        # every correctness test there is while being worthless, so CI runs the
        # index twice and fails if the second run parsed a single file.
        run: |
          python core/scripts/jspec.py index --profile jspec-self > index1.json
          python core/scripts/jspec.py index --profile jspec-self > index2.json
          python -c "
          import json, sys
          first = json.load(open('index1.json'))
          second = json.load(open('index2.json'))
          problems = []
          if first['symbols'] < 100:
              problems.append(f\"only {first['symbols']} symbols indexed\")
          if first['files_parsed'] != first['files_seen']:
              problems.append('first run skipped files it had never seen')
          if second['files_parsed'] != 0:
              problems.append(f\"second run re-parsed {second['files_parsed']} files\")
          if second['files_unchanged'] != first['files_seen']:
              problems.append('second run did not recognise every file as unchanged')
          if second['symbols'] != first['symbols']:
              problems.append('re-indexing changed the symbol count')
          if not second['full_text_search']:
              problems.append('no FTS5 in this SQLite build')
          sys.exit('; '.join(problems)) if problems else print(
              'ok', first['symbols'], 'symbols,', second['files_unchanged'], 'unchanged on re-run')
          "

      - name: The index lands in .sdd/index and nowhere else (C-07)
        # "git sees no new file" would be the obvious check and it is worthless:
        # .sdd/index/ is gitignored, so a database dropped anywhere ignored is
        # invisible to git by construction. So this asserts the positive - the
        # store is where the run said it was, under .sdd/index - and then that no
        # other database exists anywhere in the tree.
        run: |
          python -c "
          import json, pathlib, sys
          store = pathlib.Path(json.load(open('index2.json'))['store'])
          problems = []
          if not store.is_file():
              problems.append(f'the run reported a store at {store} that does not exist')
          if store.parent.name != 'index' or store.parent.parent.name != '.sdd':
              problems.append(f'store landed outside .sdd/index: {store}')
          strays = [
              p.as_posix() for p in pathlib.Path('.').rglob('*.db')
              if '.sdd/index/' not in p.as_posix() and '.venv' not in p.as_posix()
          ]
          if strays:
              problems.append(f'databases outside .sdd/index: {strays}')
          sys.exit('; '.join(problems)) if problems else print('ok store at', store)
          "
          git status --porcelain --untracked-files=no > tracked-changes.txt
          if [ -s tracked-changes.txt ]; then
            echo "indexing modified tracked files:"; cat tracked-changes.txt; exit 1
          fi
          echo "ok no tracked file was modified by indexing"

      - name: Blast radius finds real callers and says how sure it is (C-08)
        # A traversal that silently returns nothing passes every test that only checks
        # shapes. `open_store` is called from cli.py, tools.py and the tests, so an empty
        # answer here means the walk is broken. Also asserts the two things the answer
        # exists to carry: the certain/possible split, and the depth it searched.
        run: |
          python core/scripts/jspec.py blast-radius open_store > blast_name.json
          python core/scripts/jspec.py blast-radius core/src/jspec/graph/store.py > blast_file.json
          python -c "
          import json, sys
          name = json.load(open('blast_name.json'))
          file = json.load(open('blast_file.json'))
          problems = []
          if name['counts']['total'] < 3:
              problems.append(f\"open_store has {name['counts']['total']} dependents, expected at least 3\")
          if name['counts']['certain'] < 1:
              problems.append('no dependent was certain: the resolver never links a call to its import')
          if name['counts']['certain'] + name['counts']['possible'] != name['counts']['total']:
              problems.append('certain + possible does not add up to the total')
          if set(name['depth']) != {'limit', 'reached', 'complete', 'stopped_by'}:
              problems.append(f\"depth block is incomplete: {name['depth']}\")
          if not name['limits']:
              problems.append('the answer carries no statement of what it cannot see')
          if file['mode'] != 'file' or file['counts']['total'] < 1:
              problems.append('the import graph found no importer of store.py')
          sys.exit('; '.join(problems)) if problems else print(
              'ok', name['summary'])
          "

      - name: The profiler drafts this repository and shows its working (C-26)
        # A profiler that returns a confident-looking draft passes every shape test. So
        # this drafts the one repository CI can see and checks the answer against what
        # is known to be true - and that no field is a value without evidence, which is
        # the property that separates a draft from a guess.
        run: |
          python core/scripts/jspec.py profile draft . --name ci-self > profile_draft.json
          python -c "
          import json, sys
          draft = json.load(open('profile_draft.json'))
          f = {x['field']: x for x in draft['findings']}
          problems = []
          if f['languages']['value'] != ['python']:
              problems.append(f\"languages {f['languages']['value']}, expected ['python']\")
          if f['source_dirs']['value'] != ['core/src/']:
              problems.append(f\"source_dirs {f['source_dirs']['value']}, expected ['core/src/']\")
          if f['test_dirs']['value'] != ['tests/'] or f['test_dirs']['basis'] != 'found':
              problems.append('test_dirs should be found in pytest.ini')
          if f['validation.test']['value'] != 'pytest':
              problems.append(f\"validation.test {f['validation.test']['value']!r}\")
          bare = [k for k, v in f.items() if v['basis'] != 'unknown' and not v['evidence']]
          if bare:
              problems.append(f'fields with a value and no evidence: {bare}')
          if sum(draft['summary'].values()) != 9:
              problems.append('the draft does not cover all nine fields')
          sys.exit('; '.join(problems)) if problems else print('ok', draft['summary'])
          "
          git status --porcelain --untracked-files=no > tracked-changes.txt
          if [ -s tracked-changes.txt ]; then
            echo "profiling modified tracked files:"; cat tracked-changes.txt; exit 1
          fi
          echo "ok profiling left every tracked file alone"

  artifacts:
    # Config files are load-bearing: a malformed plugin manifest or template
    # registry fails at runtime, in someone's session, with a worse error message.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        # The package itself, not a hand-kept list. This job runs jspec.py, which imports
        # pydantic; it installed only pyyaml and so failed on every push from C-06 on
        # while the `test` jobs stayed green. core/pyproject.toml is the one place the
        # dependencies are declared, and a second list here is what went stale.
        run: python -m pip install ./core

      - name: Plugin manifest and MCP config parse
        run: |
          python -c "
          import json, sys
          for p in ('jspec/.claude-plugin/plugin.json', 'jspec/.mcp.json', 'jspec/hooks/hooks.json'):
              with open(p) as f:
                  json.load(f)
              print(f'ok {p}')
          "

      - name: Plugin manifest has the required fields
        run: |
          python -c "
          import json, sys
          m = json.load(open('jspec/.claude-plugin/plugin.json'))
          missing = [k for k in ('name', 'description') if not m.get(k)]
          sys.exit(f'plugin.json missing: {missing}') if missing else print('ok', m['name'])
          "

      - name: Template registry parses and every template declares its contract
        run: |
          python -c "
          import sys, yaml
          reg = yaml.safe_load(open('templates/registry.yaml'))
          required = ('output_schema', 'question_budget', 'token_budget', 'rubric')
          bad = {
              name: [k for k in required if k not in body]
              for name, body in reg['templates'].items()
              if any(k not in body for k in required)
          }
          sys.exit(f'templates missing contract fields: {bad}') if bad else print(f\"ok {len(reg['templates'])} templates\")
          "

      - name: Skills declare a description, and step skills stay model-locked
        run: |
          python -c "
          import pathlib, sys
          errs = []
          for p in pathlib.Path('jspec/skills').glob('*/SKILL.md'):
              head = p.read_text(encoding='utf-8').split('---')[1]
              if 'description:' not in head:
                  errs.append(f'{p}: no description')
              # Only the router may be model-invoked; a step skill that self-triggers
              # can skip the spec entirely.
              if p.parent.name != 'router' and 'disable-model-invocation: true' not in head:
                  errs.append(f'{p}: step skill must set disable-model-invocation')
          sys.exit(chr(10).join(errs)) if errs else print('ok skills')
          "

      - name: Every shipped profile is valid
        run: |
          python -c "
          import sys, yaml, pathlib
          required = ('name', 'description', 'languages', 'source_dirs', 'validation')
          errs = []
          paths = sorted(pathlib.Path('profiles').glob('*.yaml'))
          if not paths:
              sys.exit('no profiles shipped; C-25 requires at least two worked examples')
          for path in paths:
              body = yaml.safe_load(path.read_text()) or {}
              missing = [k for k in required if k not in body]
              if missing:
                  errs.append(f'{path}: missing {missing}')
              declared = body.get('name')
              if declared != path.stem:
                  errs.append(f'{path}: name {declared!r} != filename {path.stem!r}')
              # A profile with no test command lets the validator run nothing and
              # report success. That false green is the failure C-25 exists to stop.
              if not (body.get('validation') or {}).get('test'):
                  errs.append(f'{path}: validation.test is required')
          sys.exit(chr(10).join(errs)) if errs else print(f'ok {len(paths)} profiles')
          "

      - name: The tool surface runs, and unbuilt tools refuse rather than guess
        run: |
          python core/scripts/jspec.py tools
          python core/scripts/jspec.py classify "add password reset" > /dev/null
          python core/scripts/jspec.py plan-chain T-2 --profile python-service > /dev/null
          # An empty profile must be REJECTED. The old form (`... && exit 1 || true`) could
          # not tell a rejection from a crash: an uncaught exception also exits 1, which
          # is the code the command uses for "the answer is no". So assert the verdict
          # itself, which only a working command can print.
          verdict=$(echo '{}' | python core/scripts/jspec.py validate profile - || true)
          echo "$verdict" | grep -q '"ok": false' \
            || { echo "validate did not reject an empty profile; it printed: $verdict"; exit 1; }
          echo ok tool surface

      - name: Domain knowledge stays in profiles, not in core (constitution rule 20)
        run: python core/scripts/check_domain_neutrality.py

      - name: No API key may be required on any default path
        run: |
          ! grep -rn --include=*.py --include=*.yaml --include=*.json \
              -e 'ANTHROPIC_API_KEY *=' -e '\-\-bare' core jspec templates \
            || (echo 'API key or --bare found; see DECISIONS.md D-006' && exit 1)
