[project]
name = "jspec"
version = "0.1.0"
description = "AI-native spec-driven development. Deterministic core for the JSpec Claude Code plugin."
readme = "../README.md"
# 3.14 is deliberately excluded: tree-sitter bindings and sqlite-vec wheels lag
# there, which means building from source. See DECISIONS.md D-013.
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.9",
    "mcp>=1.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
graph = ["tree-sitter>=0.23", "tree-sitter-language-pack>=0.4"]
search = ["sqlite-vec>=0.1.6"]
dev = ["pytest>=8.3", "ruff>=0.7"]

[project.scripts]
jspec = "jspec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jspec"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["../tests"]
